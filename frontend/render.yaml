# Render Blueprint — Frontend (Streamlit)
# Deploy: Render Dashboard → New → Blueprint → connect repo
# Or create Web Service manually with settings below.

services:
  - type: web
    name: team-task-manager-frontend
    runtime: python
    plan: free
    rootDir: frontend
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true --browser.gatherUsageStats=false
    healthCheckPath: /
    envVars:
      - key: API_BASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
